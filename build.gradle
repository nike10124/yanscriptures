plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    // [保留] 注意：虽然本模组自己已放弃 Mixin，但这个插件不要删。
    // 它注册了 Mixin 注解处理器（生成 refmap）以及运行时相关的 Gradle 支持，
    // 删掉会破坏依赖 Curios 等"带 Mixin 的第三方模组"在开发环境下的正常加载。
    // 真正导致"发布包启动崩溃"的只有下方 manifest 里的 MixinConfigs，已单独注释。
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // ==================== Mixin 配置（务必保留！） ====================
            // 放在 configureEach 里，所有运行配置都会应用
            //
            // 【重要 · 2026-10-21 更正】这两行不是给"本模组自己的 Mixin"用的，所以不能因为
            // 我们放弃了 Mixin 就注释掉。它们是给【所有带 Mixin 的第三方模组】在开发环境里
            // 做 refmap 反向重映射用的。当前工程依赖 Curios，Curios 自带 curios.mixins.json
            // 并带 SRG 名 refmap；开发环境用 official 映射，运行时字段是 firstTick，
            // 而 refmap 里写的是 SRG 名 f_19803_Z，没有这两行就会报：
            //   MixinApplyError: Mixin [curios.mixins.json:AccessorEntity] FAILED during APPLY
            //   InvalidAccessorException: No candidates were found matching f_19803_Z
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // [2026-10-23] 客户端 JVM 参数。
            // 背景：装完 9 个外部模组后，JVM 在 C2 编译线程里申请原生内存失败而崩溃：
            //   "Native memory allocation (malloc) failed ... Error detail: Chunk::new"
            // 显式限定堆与元空间、并把 JIT 编译线程压到 2，能明显降低原生内存峰值。
            jvmArgs '-Xms1G', '-Xmx4G', '-XX:MaxMetaspaceSize=1G', '-XX:CICompilerCount=2'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// ==================== Mixin 配置 ====================
// 必须在 minecraft 块的外面，作为顶层块
//mixin {
//    add sourceSets.main, "examplemod.refmap.json"
//    config "examplemod.mixins.json"
//}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
}

// ==================== 离线环境补丁（2026-10-23）====================
// runClient 的 minecraftCopy 配置要求 net.minecraftforge:srgutils:0.4.11，
// 但这台机器的 Gradle 缓存里只有 0.4.15 / 0.6.2，且当前无法访问 maven.minecraftforge.net。
// 定向 force 到已缓存的 0.4.15（同为 0.4.x，属构建期工具库，不进入游戏运行时）。
configurations.configureEach {
    resolutionStrategy {
        force 'net.minecraftforge:srgutils:0.4.15'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Curios 改走本地仓库（libs/curios-forge-5.14.1+1.20.1.jar）：
    // 原在线坐标 top.theillusivec4.curios 需要访问 maven.theillusivec4.top，这台机器不通。
    // 本地 jar 里同时含 API 与实现，所以 compileOnly / runtimeOnly 用同一个坐标即可。
    // 坐标见 design/make_local_m2.py 的 ITEMS（artifactId=curios-forge, version=5.14.1-1.20.1）。
    compileOnly fg.deobf('maven.modrinth:curios-forge:5.14.1-1.20.1')
    runtimeOnly fg.deobf('maven.modrinth:curios-forge:5.14.1-1.20.1')


}

// ==================== 测试用外部模组（2026-10-22）====================
// 用途：只为了让 runClient 里能加载这些模组做玩法/数值对照测试。
// 它们全部是 runtimeOnly —— **不进编译类路径**，所以就算某个版本挂掉也不会影响 compileJava。
// 坐标一律用 Modrinth 的「版本 ID」而不是版本号，避免作者发新版导致构建漂移。
//
// 依赖链（都是上机实测要求，缺一个 runClient 就起不来）：
//   Goety ─ 需要 Curios（已有）+ Patchouli
//   Goety: Revelation ─ 需要 Goety 2.5.59.0（它的 mods.toml 就钉死这个版本）+ EndingLibrary
//   MmmMmmMmmMmm（假人）─ 需要 Moonlight
//   Enigmatic Legacy（神秘遗物）─ 需要 Caelus + Patchouli + Curios
//
// 想整体关掉：把 ENABLE_TEST_MODS 改成 false，或直接注释掉整个 if 块。
//
// 【重要】默认 false。原因：这台机器的进程连不上 api.modrinth.com / cdn.modrinth.com
// （curl ERR:35 SSL 握手失败、ERR:28 超时，maven.minecraftforge.net 同样不通），
// 一旦置 true，runClient 会在依赖解析阶段直接失败 —— 而 compileJava 不受影响。
// 等能连上了（或走下面的本地 jar 方案）再打开。
def ENABLE_TEST_MODS = false

// 方案 B：本地仓库。libs/ 里放好 jar 后运行
//   python design/make_local_m2.py
// 它会把这些 jar 按 Modrinth 的目录布局复制进 libs-m2/maven（并生成最小 POM），
// 于是下面仍可以用和在线方案**完全一样的坐标** —— fg.deobf 才会做重映射。
//
// 为什么不能直接 fg.deobf(files(...))：ForgeGradle 明确拒绝文件集合依赖
//   "files(...) dependencies are not deobfuscated ... using obfuscated version!"
// 那样 jar 会以 SRG 混淆状态进运行时，启动就报 NoSuchMethodError。
def USE_LOCAL_MOD_JARS = true

// CurseForge 的模组（如「星月遗物」）若走在线方案才需要这个开关。
def USE_CURSEMAVEN = false

if (USE_CURSEMAVEN) {
    repositories {
        maven { url = 'https://cursemaven.com' }
    }
}

if (ENABLE_TEST_MODS) {
    repositories {
        maven { url = 'https://api.modrinth.com/maven' }
    }
    dependencies {
        // ---- 前置库 ----
        runtimeOnly fg.deobf('maven.modrinth:patchouli:94dtOLgZ')        // Patchouli 1.20.1-85
        runtimeOnly fg.deobf('maven.modrinth:caelus:mRry0DgY')           // Caelus 3.2.0+1.20.1
        runtimeOnly fg.deobf('maven.modrinth:moonlight:b1cuadwV')        // Moonlight 1.20-2.16.37
        runtimeOnly fg.deobf('maven.modrinth:endinglibrary:MHYrjSc5')    // EndingLibrary（Revelation 前置）

        // ---- 内容模组 ----
        runtimeOnly fg.deobf('maven.modrinth:goety:D3VzEoO9')            // Goety 2.5.59.0（诡厄巫法）
        runtimeOnly fg.deobf('maven.modrinth:goety-revelation:t59lWC8J') // Goety: Revelation 2.3.5（启示录）
        runtimeOnly fg.deobf('maven.modrinth:mmmmmmmmmmmm:c1HMqDvI')     // Target Dummy（假人）
        runtimeOnly fg.deobf('maven.modrinth:enigmatic-legacy:yUuDfmnk') // Enigmatic Legacy 2.30.1（神秘遗物）

        // ---- 星月遗物（Celestial Artifacts）----
        // 只在 CurseForge 发布，需要 CurseMaven 坐标 curse.maven:<slug>-<项目ID>:<文件ID>，
        // 打开 USE_CURSEMAVEN 并填好 ID 后启用下面这行。
        // runtimeOnly fg.deobf('curse.maven:celestial-artifacts-XXXXXX:YYYYYYY')
    }
}

if (USE_LOCAL_MOD_JARS) {
    repositories {
        // design/make_local_m2.py 生成的本地仓库（groupId 依旧是 maven.modrinth）
        maven { url = uri("${projectDir}/libs-m2/maven") }
    }
    dependencies {
        runtimeOnly fg.deobf('maven.modrinth:patchouli:94dtOLgZ')
        runtimeOnly fg.deobf('maven.modrinth:caelus:mRry0DgY')
        runtimeOnly fg.deobf('maven.modrinth:moonlight:b1cuadwV')
        runtimeOnly fg.deobf('maven.modrinth:endinglibrary:MHYrjSc5')
        runtimeOnly fg.deobf('maven.modrinth:goety:D3VzEoO9')
        runtimeOnly fg.deobf('maven.modrinth:goety-revelation:t59lWC8J')
        // [移除 2026-10-23] Target Dummy（假人）：这个 jar 根目录里没有 refmap，
        // 它的 mixin 目标写死 SRG 名（m_6475_），在 official 映射的开发环境里必然
        // 报 InvalidInjectionException: could not find any targets matching 'm_6475_(...)V'。
        // 想测伤害改用原版指令即可：
        //   /summon zombie ~ ~ ~ {NoAI:1b,Silent:1b,Tags:["dummy"],Attributes:[{Name:"generic.max_health",Base:1000}]}
        //   /damage @e[tag=dummy,limit=1] 10 minecraft:player_attack
        //   /data get entity @e[tag=dummy,limit=1] Health
        // runtimeOnly fg.deobf('maven.modrinth:mmmmmmmmmmmm:c1HMqDvI')
        runtimeOnly fg.deobf('maven.modrinth:enigmatic-legacy:yUuDfmnk')
        runtimeOnly fg.deobf('maven.modrinth:celestial-core:1.6.1')       // 星月遗物前置
        runtimeOnly fg.deobf('maven.modrinth:celestial-artifacts:1.6.5')  // 星月遗物

        // ---- 开发辅助 / 配方页（2026-10-28）----
        // JEI：compileOnly 为了写 IModPlugin 实现；runtimeOnly 为了在 runClient 里真的看到配方页。
        compileOnly fg.deobf('maven.modrinth:jei:15.74.0.229')
        runtimeOnly fg.deobf('maven.modrinth:jei:15.74.0.229')
        // Jade：只在运行时用来看方块/实体信息，不写插件，所以不需要 compileOnly。
        runtimeOnly fg.deobf('maven.modrinth:jade:11.13.3')
    }
}

if (USE_LOCAL_MOD_JARS) {
    dependencies {
        // [已废弃 2026-10-23] 不要用 files(fileTree(...))：
        // ForgeGradle 拒绝给文件集合依赖做重映射，jar 会以 SRG 混淆状态进入运行时。
        // 正确做法见上面「本地仓库」那一段（libs-m2 + maven.modrinth 坐标）。
        // runtimeOnly fg.deobf(files(fileTree(dir: 'libs', include: '*.jar')))
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // [已禁用 2026-10-21] 关键一行：保留会在正式 jar 里声明 MixinConfigs，
                // 而 BlockDropResourcesMixin 已不存在 → 游戏启动崩溃。开发环境因为不是 jar 所以看不出来。
                // [2026-10-30] 悬空的 mixin 源码已移到 backup/round5/，这里保持注释状态；
                //              以后要恢复 mixin，先同时恢复 src/main/java/.../mixin 与 resources 下的 json。
                // "MixinConfigs"            : "examplemod.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}