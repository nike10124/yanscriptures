modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Yan的书籍饰品"
logoFile="logo.png"
issueTrackerURL="https://github.com/nike10124/yanscriptures/issues"
description='''收集世界名著，将它们化作力量。一本本传奇典籍，记录你的冒险旅程。'''
authors="${mod_authors}"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
mandatory=true
versionRange="[5.14.1,)"
ordering="AFTER"
side="BOTH"

# 软依赖：装了才有 JEI 分类与说明页，没装不影响任何玩法
[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="[15,)"
ordering="AFTER"
side="CLIENT"

# 以下模组提供部分史诗书的材料与「安息仪式」，装了玩法才完整；
# 不装也能启动，只是相关内容缺失（配方会被跳过），不会崩溃。
[[dependencies.${mod_id}]]
modId="goety"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="goety_revelation"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="celestial_core"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="celestial_artifacts"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="enigmaticlegacy"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

